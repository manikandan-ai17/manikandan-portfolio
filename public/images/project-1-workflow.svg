<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020818"/><stop offset="100%" stop-color="#010408"/></linearGradient>
    <radialGradient id="gl" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.12"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.03"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#gl)"/><rect width="1200" height="675" fill="url(#gr)"/>
  <rect width="1200" height="44" fill="#030A18" fill-opacity="0.95"/>
  <circle cx="28" cy="22" r="5.5" fill="#EF4444" fill-opacity="0.85"/><circle cx="46" cy="22" r="5.5" fill="#F59E0B" fill-opacity="0.85"/><circle cx="64" cy="22" r="5.5" fill="#10B981" fill-opacity="0.85"/>
  <text x="88" y="26" font-family="'SF Mono',monospace" font-size="11" fill="#1A2A50">adm-retail-platform · AI Workflow</text>
  <text x="60" y="98" font-family="'SF Pro Display',system-ui,sans-serif" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="3">AI WORKFLOW</text>
  <text x="60" y="130" font-family="'SF Pro Display',system-ui,sans-serif" font-size="28" font-weight="800" fill="#F1F5F9">Product Enrichment Data Flow</text>
  <text x="60" y="156" font-family="'SF Pro Display',system-ui,sans-serif" font-size="13" fill="#1A2A50">From raw supplier Excel → AI enrichment → schema validation → Shopify publish</text>

  <!-- Main flow row -->
  <!-- Node 1: Upload -->
  <rect x="60" y="210" width="160" height="80" rx="10" fill="#071020" stroke="#2563EB" stroke-width="1" stroke-opacity="0.5"/>
  <text x="140" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="700">SUPPLIER FILE</text>
  <text x="140" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Excel / CSV</text>
  <text x="140" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#1A2A50" text-anchor="middle">S3 upload</text>
  <!-- Arrow -->
  <line x1="220" y1="250" x2="258" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="257,246 265,250 257,254" fill="#2563EB" fill-opacity="0.5"/>
  <!-- Node 2: Schema -->
  <rect x="264" y="210" width="160" height="80" rx="10" fill="#071020" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>
  <text x="344" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="700">COLUMN MAP</text>
  <text x="344" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Schema Detect</text>
  <text x="344" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#1A2A50" text-anchor="middle">FastAPI service</text>
  <!-- Arrow -->
  <line x1="424" y1="250" x2="462" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="461,246 469,250 461,254" fill="#2563EB" fill-opacity="0.5"/>
  <!-- Node 3: LLM -->
  <rect x="468" y="210" width="160" height="80" rx="10" fill="#0A1428" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="468" y="210" width="160" height="3" rx="1" fill="#7c3aed"/>
  <text x="548" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="700">LLM ENRICHMENT</text>
  <text x="548" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#F1F5F9" text-anchor="middle">Fill missing fields</text>
  <text x="548" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#4A2A8A" text-anchor="middle">desc · material · dims</text>
  <!-- Arrow -->
  <line x1="628" y1="250" x2="666" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="665,246 673,250 665,254" fill="#2563EB" fill-opacity="0.5"/>
  <!-- Node 4: Validate -->
  <rect x="672" y="210" width="160" height="80" rx="10" fill="#071020" stroke="#10B981" stroke-width="1"/>
  <text x="752" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">PYDANTIC VALIDATE</text>
  <text x="752" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Schema enforced</text>
  <text x="752" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#1A5030" text-anchor="middle">reject / retry on fail</text>
  <!-- Arrow -->
  <line x1="832" y1="250" x2="870" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="869,246 877,250 869,254" fill="#2563EB" fill-opacity="0.5"/>
  <!-- Node 5: Taxonomy -->
  <rect x="876" y="210" width="160" height="80" rx="10" fill="#071020" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>
  <text x="956" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="700">TAXONOMY</text>
  <text x="956" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Classify product</text>
  <text x="956" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#1A2A50" text-anchor="middle">rule + LLM fallback</text>
  <!-- Arrow -->
  <line x1="1036" y1="250" x2="1074" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="1073,246 1081,250 1073,254" fill="#2563EB" fill-opacity="0.5"/>
  <!-- Node 6: Shopify -->
  <rect x="1080" y="210" width="100" height="80" rx="10" fill="#041810" stroke="#10B981" stroke-width="1.5"/>
  <rect x="1080" y="210" width="100" height="3" rx="1" fill="#10B981"/>
  <text x="1130" y="244" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">SHOPIFY</text>
  <text x="1130" y="260" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#F1F5F9" text-anchor="middle">Publish</text>
  <text x="1130" y="276" font-family="'SF Mono',monospace" font-size="8" fill="#1A5030" text-anchor="middle">Admin REST API</text>

  <!-- Second row: Review branch -->
  <!-- Down arrow from taxonomy -->
  <line x1="956" y1="290" x2="956" y2="370" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Review node -->
  <rect x="876" y="370" width="160" height="70" rx="10" fill="#071020" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
  <text x="956" y="400" font-family="'SF Mono',monospace" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="700">HUMAN REVIEW</text>
  <text x="956" y="416" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">React dashboard</text>
  <text x="956" y="430" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A00" text-anchor="middle">approve / reject</text>
  <!-- Approved arrow to Shopify -->
  <line x1="1036" y1="405" x2="1130" y2="405" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="1130" y1="405" x2="1130" y2="290" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5"/>
  <polygon points="1126,291 1130,283 1134,291" fill="#10B981" fill-opacity="0.5"/>
  <!-- Rejected loop back -->
  <line x1="876" y1="405" x2="820" y2="405" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="820" y1="405" x2="820" y2="250" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="820" y1="250" x2="672" y2="250" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <text x="840" y="342" font-family="'SF Mono',monospace" font-size="8" fill="#EF4444">reject →</text>
  <text x="840" y="354" font-family="'SF Mono',monospace" font-size="8" fill="#EF4444">re-queue</text>

  <!-- Data detail panels -->
  <!-- Enrichment detail -->
  <rect x="60" y="370" width="380" height="120" rx="10" fill="#071020" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="80" y="394" font-family="'SF Mono',monospace" font-size="8.5" fill="#60a5fa" font-weight="700">ENRICHMENT EXAMPLE</text>
  <text x="80" y="414" font-family="'SF Mono',monospace" font-size="8.5" fill="#EF4444">BEFORE:  name="Blue Jacket"  description=""  material=""</text>
  <text x="80" y="434" font-family="'SF Mono',monospace" font-size="8.5" fill="#10B981">AFTER:   name="Blue Denim Jacket"</text>
  <text x="80" y="450" font-family="'SF Mono',monospace" font-size="8.5" fill="#10B981">         description="Classic 5-pocket blue denim jacket..."</text>
  <text x="80" y="466" font-family="'SF Mono',monospace" font-size="8.5" fill="#10B981">         material="100% Cotton Denim"</text>
  <text x="80" y="482" font-family="'SF Mono',monospace" font-size="8.5" fill="#34d399">         schema_valid: true</text>

  <!-- Retry detail -->
  <rect x="460" y="370" width="380" height="120" rx="10" fill="#071020" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="480" y="394" font-family="'SF Mono',monospace" font-size="8.5" fill="#fbbf24" font-weight="700">VALIDATION RETRY LOOP</text>
  <text x="480" y="414" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">attempt_1: price missing → corrective prompt</text>
  <text x="480" y="430" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">attempt_2: price="$89.99" (wrong type)</text>
  <text x="480" y="446" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">           → prompt: "price must be float, not string"</text>
  <text x="480" y="462" font-family="'SF Mono',monospace" font-size="8.5" fill="#10B981">attempt_3: price=89.99  ✓ valid</text>

  <text x="60" y="560" font-family="'SF Mono',monospace" font-size="10" fill="#1A2A50" font-weight="600" letter-spacing="2">ADM RETAIL PLATFORM · AI Enrichment Workflow</text>
</svg>