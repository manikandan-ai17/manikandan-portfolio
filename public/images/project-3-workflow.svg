  <text x="60" y="156" font-family="'SF Pro Display',system-ui,sans-serif" font-size="13" fill="#0A2A18">Deterministic candlestick detection · 14 patterns · AI recommendation layer</text>

  <!-- Step 1: User selects symbol -->
  <rect x="60" y="192" width="180" height="90" rx="10" fill="#050E06" stroke="#059669" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="150" y="218" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">SYMBOL SELECT</text>
  <text x="150" y="236" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">User picks pair</text>
  <text x="150" y="252" font-family="'SF Mono',monospace" font-size="8.5" fill="#1A4028" text-anchor="middle">BTCUSDT · 1H</text>
  <text x="150" y="268" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">Overlay panel</text>
  <!-- Arrow -->
  <line x1="240" y1="237" x2="278" y2="237" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="277,233 285,237 277,241" fill="#059669" fill-opacity="0.5"/>
  <!-- Step 2: Binance call -->
  <rect x="284" y="192" width="180" height="90" rx="10" fill="#050E06" stroke="#059669" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="374" y="218" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">BINANCE API</text>
  <text x="374" y="234" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">GET /api/v3/klines</text>
  <text x="374" y="250" font-family="'SF Mono',monospace" font-size="8.5" fill="#1A4028" text-anchor="middle">50 candles OHLCV</text>
  <text x="374" y="264" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">Rate limited 2 req/s</text>
  <!-- Arrow -->
  <line x1="464" y1="237" x2="502" y2="237" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="501,233 509,237 501,241" fill="#059669" fill-opacity="0.5"/>
  <!-- Step 3: Parser -->
  <rect x="508" y="192" width="180" height="90" rx="10" fill="#050E06" stroke="#059669" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="598" y="218" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">DATA PARSER</text>
  <text x="598" y="234" font-family="'SF Pro Display',system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">OHLCV normalize</text>
  <text x="598" y="250" font-family="'SF Mono',monospace" font-size="8.5" fill="#1A4028" text-anchor="middle">open/high/low/close</text>
  <text x="598" y="264" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">volume arrays</text>
  <!-- Arrow -->
  <line x1="688" y1="237" x2="726" y2="237" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="725,233 733,237 725,241" fill="#059669" fill-opacity="0.5"/>
  <!-- Step 4: Pattern Engine -->
  <rect x="732" y="172" width="220" height="130" rx="10" fill="#060E08" stroke="#059669" stroke-width="1.5"/>
  <rect x="732" y="172" width="220" height="3" rx="1" fill="#059669"/>
  <text x="842" y="194" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">PATTERN ENGINE · 14 CHECKS</text>
  <text x="742" y="212" font-family="'SF Mono',monospace" font-size="8" fill="#86efac">✓ Bullish Engulfing  87%</text>
  <text x="742" y="226" font-family="'SF Mono',monospace" font-size="8" fill="#86efac">✓ Hammer           74%</text>
  <text x="742" y="240" font-family="'SF Mono',monospace" font-size="8" fill="#475569">○ Morning Star     n/a</text>
  <text x="742" y="254" font-family="'SF Mono',monospace" font-size="8" fill="#475569">○ Doji             n/a</text>
  <text x="742" y="268" font-family="'SF Mono',monospace" font-size="8" fill="#475569">○ 10 more checked...</text>
  <text x="742" y="290" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028">deterministic ratio checks</text>
  <!-- Arrow -->
  <line x1="952" y1="237" x2="990" y2="237" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="989,233 997,237 989,241" fill="#059669" fill-opacity="0.5"/>
  <!-- Step 5: AI Rec -->
  <rect x="996" y="172" width="164" height="130" rx="10" fill="#060E08" stroke="#10B981" stroke-width="1.5"/>
  <rect x="996" y="172" width="164" height="3" rx="1" fill="#10B981"/>
  <text x="1078" y="194" font-family="'SF Mono',monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">AI SIGNAL</text>
  <text x="1078" y="220" font-family="'SF Pro Display',system-ui,sans-serif" font-size="32" font-weight="900" fill="#10B981" text-anchor="middle">BUY</text>
  <text x="1078" y="244" font-family="'SF Mono',monospace" font-size="8.5" fill="#1A4028" text-anchor="middle">87% confidence</text>
  <text x="1078" y="260" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">Engulfing + support</text>
  <text x="1078" y="275" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">AI rationale</text>
  <text x="1078" y="291" font-family="'SF Mono',monospace" font-size="8" fill="#1A4028" text-anchor="middle">→ overlay panel</text>

  <!-- Cache note -->
  <rect x="284" y="320" width="180" height="50" rx="8" fill="#050E06" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="374" y="340" font-family="'SF Mono',monospace" font-size="8.5" fill="#fbbf24" text-anchor="middle" font-weight="700">30s RESPONSE CACHE</text>
  <text x="374" y="354" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A00" text-anchor="middle">Same symbol → cached response</text>
  <text x="374" y="367" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A00" text-anchor="middle">300ms debounce on symbol input</text>
  <line x1="374" y1="282" x2="374" y2="320" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,2"/>

  <!-- Pattern detail box -->
  <rect x="60" y="390" width="900" height="180" rx="12" fill="#050E06" stroke="#059669" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="80" y="414" font-family="'SF Mono',monospace" font-size="9" fill="#059669" font-weight="700" letter-spacing="1">PATTERN DETECTION — DETERMINISTIC RATIO CHECKS</text>
  <!-- Pattern list columns -->
  <text x="80" y="440" font-family="'SF Mono',monospace" font-size="8.5" fill="#86efac" font-weight="700">REVERSAL</text>
  <text x="80" y="456" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Bullish/Bearish Engulfing</text>
  <text x="80" y="470" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Morning Star / Evening Star</text>
  <text x="80" y="484" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Hammer / Inverted Hammer</text>
  <text x="80" y="498" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Shooting Star</text>
  <text x="330" y="440" font-family="'SF Mono',monospace" font-size="8.5" fill="#fde68a" font-weight="700">CONTINUATION</text>
  <text x="330" y="456" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Doji / Spinning Top</text>
  <text x="330" y="470" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Three White Soldiers</text>
  <text x="330" y="484" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Three Black Crows</text>
  <text x="330" y="498" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">Marubozu / Bullish Harami / Piercing Line</text>
  <!-- Example check -->
  <text x="600" y="440" font-family="'SF Mono',monospace" font-size="8.5" fill="#60a5fa" font-weight="700">BULLISH ENGULFING CHECK</text>
  <text x="600" y="456" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">prev.close &lt; prev.open  # bearish candle</text>
  <text x="600" y="470" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">curr.close &gt; curr.open  # bullish candle</text>
  <text x="600" y="484" font-family="'SF Mono',monospace" font-size="8.5" fill="#94a3b8">curr.open  &lt; prev.close  # gaps lower</text>
  <text x="600" y="498" font-family="'SF Mono',monospace" font-size="8.5" fill="#34d399">curr.close &gt; prev.open  # ✓ engulfs</text>
  <text x="600" y="512" font-family="'SF Mono',monospace" font-size="8.5" fill="#1A4028">ratio: body &gt; 0.7 × prev_range</text>
  <text x="600" y="526" font-family="'SF Mono',monospace" font-size="8.5" fill="#34d399">→ return True, confidence=HIGH</text>

  <text x="60" y="628" font-family="'SF Mono',monospace" font-size="10" fill="#0A2A18" font-weight="600" letter-spacing="2">AI TRADING EXTENSION · Signal Detection Workflow</text>
</svg>